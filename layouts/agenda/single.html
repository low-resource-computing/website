{{ define "main" }}
{{ with .Params.note }}<p>{{ . }}</p>{{ end }}
{{ range .Params.days }}
<h2>{{ .date }}</h2>
<table class="agenda-table">
  <thead>
    <tr>
      <th scope="col">Time</th>
      <th scope="col">What</th>
      <th scope="col">Where</th>
    </tr>
  </thead>
  <tbody>
    {{ range .items }}
    <tr>
      <td>{{ .time }}</td>
      <td>{{ .event }}</td>
      <td>{{ .location }}</td>
    </tr>
    {{ end }}
  </tbody>
</table>
{{ end }}
{{ end }}
